services:
  nginx:
    container_name: flowcheck-nginx
    image: nginx:1.27-alpine
    restart: on-failure:3
    env_file:
      - ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certbot-data/conf:/etc/letsencrypt
      - ./certbot-data/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - flowcheck-network

  frontend:
    container_name: flowcheck-frontend
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: ${DOCKER_USERNAME:-flowcheck-local}/${FRONTEND_IMAGE:-flowcheck-frontend}:latest
    restart: on-failure:3
    networks:
      - flowcheck-network

  backend:
    container_name: flowcheck-backend
    build:
      context: ./backend
    image: ${DOCKER_USERNAME:-flowcheck-local}/${BACKEND_IMAGE:-flowcheck-backend}:latest
    restart: on-failure:3
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      FASTAPI_URL: http://ai:8000
    depends_on:
      - ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - flowcheck-network

  ai:
    container_name: flowcheck-ai
    build:
      context: ./ai
    image: ${DOCKER_USERNAME:-flowcheck-local}/${AI_IMAGE:-flowcheck-ai}:latest
    restart: on-failure:3
    env_file:
      - ./.env
    environment:
      BACKEND_URL: http://backend:8080
      USE_FARGATE: ${USE_FARGATE:-true}
      ECS_UIUX_TASK_FAMILY: ${ECS_UIUX_TASK_FAMILY:-flowcheck-uiux-task}
      ECS_UIUX_CONTAINER_NAME: ${ECS_UIUX_CONTAINER_NAME:-flowcheck-ai}
    networks:
      - flowcheck-network

networks:
  flowcheck-network:
    driver: bridge
