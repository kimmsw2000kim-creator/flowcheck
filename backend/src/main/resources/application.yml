spring:
  application:
    name: flowcheck
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowcheck}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3 # 개발환경에서는 3개면 충분
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL}
          jws-algorithms:
            - ES256

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwt:
    key: ${SUPABASE_JWT_KEY}

gemini:
  api-key: ${GEMINI_API_KEY:}

http-client:
  ssl:
    trust-all: ${HTTP_CLIENT_SSL_TRUST_ALL:true}

toss:
  secret-key: ${TOSS_WIDGET_SECRET_KEY:${TOSS_SECRET_KEY:}}
  client-key: ${VITE_TOSS_CLIENT_KEY:${TOSS_WIDGET_CLIENT_KEY:${TOSS_CLIENT_KEY:}}}

external:
  fastapi:
    base-url: ${FASTAPI_URL}

fastapi:
  url: ${FASTAPI_URL:http://localhost:8000}

http-client:
  connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:5000}
  default-read-timeout-ms: ${HTTP_CLIENT_DEFAULT_READ_TIMEOUT_MS:60000}
  load-test-read-timeout-ms: ${HTTP_CLIENT_LOAD_TEST_READ_TIMEOUT_MS:900000}

internal:
  fastapi-api-key: ${FASTAPI_INTERNAL_API_KEY:${UIUX_TEST_CALLBACK_TOKEN:${LOAD_TEST_CALLBACK_TOKEN:}}}
  load-test-callback-token: ${LOAD_TEST_CALLBACK_TOKEN:}
  uiux-test-callback-token: ${UIUX_TEST_CALLBACK_TOKEN:${LOAD_TEST_CALLBACK_TOKEN:}}

vnc:
  signed-url:
    secret: ${VNC_SIGNED_URL_SECRET:${SUPABASE_JWT_KEY:}}
    ttl-seconds: ${VNC_SIGNED_URL_TTL_SECONDS:300}

---
# 배포 환경(prod) 오버라이드: 개발 설정과 분리
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: 10       # 배포 환경에서는 커넥션 풀 확대
      minimum-idle: 3
      connection-timeout: 20000   # 20초 내 커넥션 획득 못하면 예외
      idle-timeout: 600000        # 10분 유휴 시 반환
      max-lifetime: 1800000       # 30분 최대 수명
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
