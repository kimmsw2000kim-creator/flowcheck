spring:
  application:
    name: flowcheck
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowcheck}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3 # 개발환경에서는 3개면 충분하답니다.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

supabase:
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY}
  jwt:
    secret: ${SUPABASE_JWT_SECRET:}

gemini:
  api-key: ${GEMINI_API_KEY:}

toss:
  secret-key: ${TOSS_SECRET_KEY:}
  client-key: ${TOSS_CLIENT_KEY:}

external:
  fastapi:
    base-url: ${FASTAPI_URL}

fastapi:
  url: ${FASTAPI_URL:http://localhost:8000}
