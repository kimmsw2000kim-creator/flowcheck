name: AI CI/CD

on:
  push:
    branches: ["dev"]
    paths:
      - "ai/**"
      - "docker-compose.yml"
      - "nginx.conf"
      - ".github/workflows/ai-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_IMAGE: flowcheck-frontend
  BACKEND_IMAGE: flowcheck-backend
  AI_IMAGE: flowcheck-ai
  REMOTE_APP_DIR: /home/ubuntu/flowcheck

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q ai

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push AI image
        uses: docker/build-push-action@v7
        with:
          context: ./ai
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: flowcheck-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create deployment environment file
        shell: bash
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          printf '%s\n' "$DOT_ENV" > deployment.env
          printf 'DOCKER_USERNAME=%s\n' "$DOCKER_USERNAME" >> deployment.env
          printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE" >> deployment.env
          printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE" >> deployment.env
          printf 'AI_IMAGE=%s\n' "$AI_IMAGE" >> deployment.env
          printf 'USE_FARGATE=true\n' >> deployment.env
          if ! grep -q "^BACKEND_PUBLIC_URL=" deployment.env; then
            DOMAIN_VALUE=$(grep "^DOMAIN=" deployment.env | tail -n 1 | cut -d "=" -f2- | tr -d '\r')
            if [ -n "$DOMAIN_VALUE" ]; then
              printf 'BACKEND_PUBLIC_URL=https://%s\n' "$DOMAIN_VALUE" >> deployment.env
            fi
          fi
          grep -q "^ECS_UIUX_TASK_FAMILY=" deployment.env || printf 'ECS_UIUX_TASK_FAMILY=flowcheck-uiux-task\n' >> deployment.env
          grep -q "^ECS_UIUX_CONTAINER_NAME=" deployment.env || printf 'ECS_UIUX_CONTAINER_NAME=flowcheck-ai\n' >> deployment.env

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.REMOTE_APP_DIR }}

      - name: Transfer deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf,deployment.env"
          target: ${{ env.REMOTE_APP_DIR }}

      - name: Deploy AI
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_TOKEN
          script: |
            set -e
            cd ${{ env.REMOTE_APP_DIR }}

            mv -f deployment.env .env
            chmod 600 .env

            printf '%s' "$DOCKER_TOKEN" |
              docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose --env-file ./.env pull ai
            docker compose --env-file ./.env run --rm --no-deps ai python uiux_task_definition_service.py
            docker compose --env-file ./.env up -d --no-deps ai
            docker compose --env-file ./.env up -d --no-deps --force-recreate nginx
            docker compose --env-file ./.env ps ai
            docker image prune -f
