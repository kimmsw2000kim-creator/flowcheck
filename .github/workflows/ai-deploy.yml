name: AI CI/CD

on:
  push:
    branches: ["dev"]
    paths:
      - "ai/**"
      - "docker-compose.yml"
      - ".github/workflows/ai-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_IMAGE: flowcheck-frontend
  BACKEND_IMAGE: flowcheck-backend
  AI_IMAGE: flowcheck-ai
  REMOTE_APP_DIR: /home/ubuntu/flowcheck

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q ai

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push AI image
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: flowcheck-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment environment file
        shell: bash
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          printf '%s\n' "$DOT_ENV" > deployment.env
          printf 'DOCKER_USERNAME=%s\n' "$DOCKER_USERNAME" >> deployment.env
          printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE" >> deployment.env
          printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE" >> deployment.env
          printf 'AI_IMAGE=%s\n' "$AI_IMAGE" >> deployment.env

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.REMOTE_APP_DIR }}

      - name: Transfer deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deployment.env"
          target: ${{ env.REMOTE_APP_DIR }}

      - name: Deploy AI
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_TOKEN
          script: |
            set -e
            cd ${{ env.REMOTE_APP_DIR }}

            mv -f deployment.env .env
            chmod 600 .env

            printf '%s' "$DOCKER_TOKEN" |
              docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose --env-file ./.env pull ai
            docker compose --env-file ./.env up -d --no-deps ai
            docker compose --env-file ./.env ps ai
            docker image prune -f