name: FlowCheck CI/CD

on:
  workflow_dispatch:

env:
  BACKEND_IMAGE: flowcheck-backend
  FRONTEND_IMAGE: flowcheck-frontend
  AI_IMAGE: flowcheck-ai
  REMOTE_APP_DIR: /home/ubuntu/flowcheck

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push AI image 
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.AI_IMAGE }}:latest

      - name: Extract frontend env from DOT_ENV
        shell: bash
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          VITE_SUPABASE_URL=$(printf '%s\n' "$DOT_ENV" | grep '^VITE_SUPABASE_URL=' | cut -d '=' -f2-)
          VITE_SUPABASE_ANON_KEY=$(printf '%s\n' "$DOT_ENV" | grep '^VITE_SUPABASE_ANON_KEY=' | cut -d '=' -f2-)

          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL missing in DOT_ENV"
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY missing in DOT_ENV"
            exit 1
          fi

          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare EC2 app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.REMOTE_APP_DIR }}

      - name: Transfer config files to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf"
          target: ${{ env.REMOTE_APP_DIR }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.REMOTE_APP_DIR }}

            echo "${{ secrets.DOT_ENV }}" > .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
            echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}" >> .env
            echo "FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}" >> .env
            echo "AI_IMAGE=${{ env.AI_IMAGE }}" >> .env
            echo "USE_FARGATE=true" >> .env
            if ! grep -q "^BACKEND_PUBLIC_URL=" .env; then
              DOMAIN_VALUE=$(grep "^DOMAIN=" .env | tail -n 1 | cut -d "=" -f2- | tr -d '\r')
              if [ -n "$DOMAIN_VALUE" ]; then
                echo "BACKEND_PUBLIC_URL=https://${DOMAIN_VALUE}" >> .env
              fi
            fi
            grep -q "^ECS_UIUX_TASK_FAMILY=" .env || echo "ECS_UIUX_TASK_FAMILY=flowcheck-uiux-task" >> .env
            grep -q "^ECS_UIUX_CONTAINER_NAME=" .env || echo "ECS_UIUX_CONTAINER_NAME=flowcheck-ai" >> .env

            for key in DOMAIN DB_HOST DB_NAME DB_USER DB_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_JWKS_URL SUPABASE_JWT_KEY GEMINI_API_KEY LOAD_TEST_CALLBACK_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET ECS_CLUSTER ECS_TASK_FAMILY ECS_SUBNET_ID ECS_SECURITY_GROUP_ID ECS_UIUX_TASK_FAMILY ECS_UIUX_CONTAINER_NAME; do
              if ! grep -q "^${key}=" .env; then
                echo "Missing required deployment env: ${key}"
                exit 1
              fi
            done

            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            docker compose --env-file ./.env pull
            docker compose --env-file ./.env run --rm --no-deps ai python uiux_task_definition_service.py
            docker compose --env-file ./.env up -d --remove-orphans
            docker compose --env-file ./.env up -d --force-recreate nginx
            docker image prune -f
