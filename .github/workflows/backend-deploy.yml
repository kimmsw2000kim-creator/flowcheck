name: Backend CI/CD

on:
  push:
    branches: ["dev"]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "nginx.conf"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_IMAGE: flowcheck-frontend
  BACKEND_IMAGE: flowcheck-backend
  AI_IMAGE: flowcheck-ai
  REMOTE_APP_DIR: /home/ubuntu/flowcheck

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/*.gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew
        working-directory: backend

      - name: Run backend tests
        run: ./gradlew test --no-daemon
        working-directory: backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: flowcheck-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment environment file
        shell: bash
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          printf '%s\n' "$DOT_ENV" > deployment.env
          printf 'DOCKER_USERNAME=%s\n' "$DOCKER_USERNAME" >> deployment.env
          printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE" >> deployment.env
          printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE" >> deployment.env
          printf 'AI_IMAGE=%s\n' "$AI_IMAGE" >> deployment.env
          printf 'USE_FARGATE=true\n' >> deployment.env
          grep -q "^ECS_UIUX_TASK_FAMILY=" deployment.env || printf 'ECS_UIUX_TASK_FAMILY=flowcheck-uiux-task\n' >> deployment.env
          grep -q "^ECS_UIUX_CONTAINER_NAME=" deployment.env || printf 'ECS_UIUX_CONTAINER_NAME=flowcheck-ai\n' >> deployment.env

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.REMOTE_APP_DIR }}

      - name: Transfer deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf,deployment.env"
          target: ${{ env.REMOTE_APP_DIR }}

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_TOKEN
          script: |
            set -e
            cd ${{ env.REMOTE_APP_DIR }}

            mv -f deployment.env .env
            chmod 600 .env

            printf '%s' "$DOCKER_TOKEN" |
              docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose --env-file ./.env pull backend
            docker compose --env-file ./.env up -d --no-deps backend
            docker compose --env-file ./.env up -d --no-deps --force-recreate nginx
            docker compose --env-file ./.env ps backend
            docker image prune -f
