name: Frontend CI/CD

on:
  push:
    branches: ["dev"]
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - "nginx.conf"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_IMAGE: flowcheck-frontend
  BACKEND_IMAGE: flowcheck-backend
  AI_IMAGE: flowcheck-ai
  REMOTE_APP_DIR: /home/ubuntu/flowcheck

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract frontend environment variables
        shell: bash
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          VITE_SUPABASE_URL=$(printf '%s\n' "$DOT_ENV" | sed -n 's/^VITE_SUPABASE_URL=//p' | tail -n 1 | tr -d '\r')
          VITE_SUPABASE_ANON_KEY=$(printf '%s\n' "$DOT_ENV" | sed -n 's/^VITE_SUPABASE_ANON_KEY=//p' | tail -n 1 | tr -d '\r')

          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL missing in DOT_ENV"
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY missing in DOT_ENV"
            exit 1
          fi

          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLIC_ANON=${{ env.VITE_SUPABASE_ANON_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: flowcheck-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment environment file
        shell: bash
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          printf '%s\n' "$DOT_ENV" > deployment.env
          printf 'DOCKER_USERNAME=%s\n' "$DOCKER_USERNAME" >> deployment.env
          printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE" >> deployment.env
          printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE" >> deployment.env
          printf 'AI_IMAGE=%s\n' "$AI_IMAGE" >> deployment.env

      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.REMOTE_APP_DIR }}

      - name: Transfer deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx.conf,deployment.env"
          target: ${{ env.REMOTE_APP_DIR }}

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_TOKEN
          script: |
            set -e
            cd ${{ env.REMOTE_APP_DIR }}

            mv -f deployment.env .env
            chmod 600 .env

            printf '%s' "$DOCKER_TOKEN" |
              docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose --env-file ./.env pull frontend
            docker compose --env-file ./.env up -d --no-deps frontend
            docker compose --env-file ./.env up -d --no-deps --force-recreate nginx
            docker compose --env-file ./.env ps frontend
            docker image prune -f